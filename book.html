<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Book a Room</title>
</head>
<body>
    <header>
      <nav>
        <ul>
          <li>
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="book.html">Book A Room</a>
            <a href="bookings.html">My Bookings</a>
            <a href="contact.html">Contact</a>
          </li>
        </ul>
      </nav>
    </header>
	<main>
		<h1>Book a Room</h1>
		<form action="#" method="post">
			<div>
				<label for="full-name">Full name</label>
				<input type="text" id="full-name" name="full_name" autocomplete="name" required>
			</div>

			<div>
				<label for="email">Email</label>
				<input type="email" id="email" name="email" autocomplete="email" required>
			</div>

			<div>
				<label for="room">Room</label>
				<select id="room" name="room" required>
					<option value="" selected disabled>Select a room</option>
					<option value="quiet-room">Quiet Room (1 person)</option>
					<option value="group-room">Group Room (5 people)</option>
					<option value="presentation-room">Presentation Room (10 people)</option>
				</select>
			</div>

			<div>
				<label for="date">Date</label>
				<input type="date" id="date" name="date" required>
			</div>

			<div>
				<label for="start-time">Start time</label>
				<input type="time" id="start-time" name="start_time" required>
			</div>

			<div>
				<label for="end-time">End time</label>
				<input type="time" id="end-time" name="end_time" required>
			</div>

			<div>
				<label for="purpose">Purpose</label>
				<textarea id="purpose" name="purpose" rows="4" required></textarea>
			</div>

			<div>
				<label for="participants">Number of participants</label>
				<input type="number" id="participants" name="participants" min="1" max="10" step="1" required>
			</div>

			<div>
				<input type="checkbox" id="terms" name="terms" value="accepted" required>
				<label for="terms">I agree to the terms and conditions.</label>
			</div>

			<button type="submit">Submit booking</button>
		</form>
	</main>
</body>
</html>
